<!doctype html>
<!--
  Source of public/og.png (1200x630). Rendered by scripts/render-brand-assets.mjs.
  Fonts are the same ones the site ships (Space Grotesk, JetBrains Mono, Geist, SIL OFL).
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>PromptShield: imagen para compartir</title>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("fonts/space-grotesk-latin.woff2") format("woff2");
        font-weight: 300 700;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 100 800;
      }
      @font-face {
        font-family: "Geist";
        src: url("fonts/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: oklch(0.155 0.012 250);
        color: oklch(0.96 0.005 250);
        font-family: "Geist", system-ui, sans-serif;
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px 60px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* The same light as the site's hero. */
      .aurora {
        position: absolute;
        inset: -10%;
        background:
          radial-gradient(
            55% 60% at 55% -8%,
            oklch(0.86 0.19 155 / 26%),
            transparent 70%
          ),
          radial-gradient(
            38% 45% at 95% 12%,
            oklch(0.72 0.14 235 / 22%),
            transparent 70%
          ),
          radial-gradient(
            32% 38% at 6% 18%,
            oklch(0.7 0.16 290 / 16%),
            transparent 70%
          );
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, oklch(1 0 0 / 4.5%) 1px, transparent 1px),
          linear-gradient(to bottom, oklch(1 0 0 / 4.5%) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(
          ellipse 90% 85% at 50% 0%,
          black 25%,
          transparent 78%
        );
      }
      .content {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 31px;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 46px;
        height: 46px;
      }

      h1 {
        margin-top: 50px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 92px;
        line-height: 1.02;
        letter-spacing: -0.035em;
      }
      .soft {
        background: linear-gradient(
          180deg,
          oklch(1 0 0),
          oklch(0.96 0.005 250 / 74%)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .brandtext {
        background: linear-gradient(
          100deg,
          oklch(0.9 0.17 160),
          oklch(0.82 0.15 200) 55%,
          oklch(0.78 0.14 250)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .chips {
        display: flex;
        gap: 12px;
      }
      .chip {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 23px;
        padding: 8px 16px;
        border-radius: 10px;
        color: oklch(0.84 0.14 var(--hue));
        background: oklch(0.84 0.14 var(--hue) / 13%);
        box-shadow: inset 0 0 0 1.5px oklch(0.84 0.14 var(--hue) / 32%);
      }
      .claim {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        color: oklch(0.78 0.015 250);
        white-space: nowrap;
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: oklch(0.86 0.19 155);
        box-shadow: 0 0 14px oklch(0.86 0.19 155 / 80%);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="aurora"></div>
      <div class="grid"></div>
      <div class="content">
        <div class="brand">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <defs>
              <linearGradient
                id="g"
                x1="6"
                y1="4"
                x2="26"
                y2="28"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="oklch(0.92 0.17 160)" />
                <stop offset="1" stop-color="oklch(0.78 0.14 215)" />
              </linearGradient>
            </defs>
            <path
              d="M16 3.5 5.5 7.4v8.2c0 6.2 4.2 11.3 10.5 13.3 6.3-2 10.5-7.1 10.5-13.3V7.4L16 3.5Z"
              stroke="url(#g)"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="M12 11.5h-1.8v9H12M20 11.5h1.8v9H20"
              stroke="url(#g)"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <rect
              x="13.1"
              y="14.6"
              width="5.8"
              height="2.8"
              rx="1.4"
              fill="url(#g)"
            />
          </svg>
          PromptShield
        </div>

        <h1>
          <span class="soft">Usa ChatGPT con<br />tus datos reales</span><br />
          <span class="brandtext">sin entregárselos</span>
        </h1>

        <div class="foot">
          <div class="chips">
            <span class="chip" style="--hue: 78">[TERM_1]</span>
            <span class="chip" style="--hue: 155">[DNI_1]</span>
            <span class="chip" style="--hue: 275">[IBAN_1]</span>
            <span class="chip" style="--hue: 205">[EMAIL_1]</span>
          </div>
          <div class="claim"><span class="dot"></span>Todo en tu navegador</div>
        </div>
      </div>
    </div>
  </body>
</html>
